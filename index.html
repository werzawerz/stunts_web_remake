<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Phones: no zooming, and draw under the notch in landscape (viewport-fit=cover). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Stunts Web</title>
    <!-- Add to Home Screen: full screen like an app (iOS Safari can't go full screen otherwise). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stunts" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; }
      /* Phones held upright: the game is landscape. */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 20; background: #000; color: #fcfc54;
          align-items: center; justify-content: center; text-align: center;
          font: bold 22px monospace; padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate">Turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
